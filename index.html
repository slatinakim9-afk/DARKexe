
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>DARK.exe — AI Text Lab</title>

<style>
:root {
  color-scheme: dark;
  --bg: #09090d;
  --panel: #14141d;
  --line: #30303e;
  --text: #f5f5fb;
  --muted: #a0a0b5;
  --accent: #a78bfa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 15% 0%, #281743, transparent 45%), var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}
.wrap {
  width: min(1000px, calc(100% - 28px));
  margin: auto;
  padding: 32px 0 50px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 38px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(135deg, #a78bfa, #6d28d9);
  font-size: 22px;
  font-weight: 900;
}
h1 { font-size: 19px; margin: 0; letter-spacing: 2px; }
.small, .muted { color: var(--muted); font-size: 12px; }
h2 {
  font-size: clamp(32px, 6vw, 48px);
  line-height: 1.1;
  letter-spacing: -1.5px;
  margin: 10px 0;
}
.hero { margin-bottom: 25px; }
.hero p { color: var(--muted); }
.eyebrow {
  color: var(--accent);
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 800;
}
.panel {
  background: #14141df5;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
select, textarea, .result {
  width: 100%;
  background: #0b0b12;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 12px;
}
select {
  width: min(100%, 300px);
  padding: 11px;
  font: inherit;
}
textarea {
  min-height: 190px;
  padding: 15px;
  resize: vertical;
  outline: none;
  font: 14px/1.7 ui-monospace, monospace;
}
textarea:focus, select:focus { border-color: var(--accent); }
textarea::placeholder { color: #707085; }
.meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 8px 2px 16px;
  color: var(--muted);
  font-size: 12px;
  flex-wrap: wrap;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  padding: 11px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #222230;
  color: white;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
button.primary {
  background: linear-gradient(135deg, #8b5cf6, #6d28d9);
  border-color: #8b5cf6;
}
button:disabled { opacity: .6; cursor: wait; }
.resultHead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 24px 0 10px;
}
.result {
  min-height: 125px;
  padding: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 14px/1.7 ui-monospace, monospace;
}
.empty { color: #77778b; }
#error {
  display: none;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 12px;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #703444;
  background: #29131a;
  color: #fecdd3;
  font-size: 13px;
}
#error.show { display: block; }
#status { color: var(--muted); font-size: 12px; }
footer {
  margin-top: 18px;
  text-align: center;
  color: #707085;
  font-size: 11px;
}
@media(max-width:600px) {
  .wrap { padding-top: 20px; }
  .panel { padding: 14px; }
  header { margin-bottom: 25px; }
  select { width: 100%; }
  .actions button { flex: 1; }
}
</style>
</head>

<body>
<main class="wrap">
  <header>
    <div class="brand">
      <div class="logo">D.</div>
      <div>
        <h1>DARK.exe</h1>
        <div class="small">AI TEXT LAB / VERSION 2.0</div>
      </div>
    </div>
    <div id="status">Проверяем API…</div>
  </header>

  <section class="hero">
    <div class="eyebrow">YOUR TEXT. YOUR RULES.</div>
    <h2>Прокачай любой текст.</h2>
    <p>Исправляй ошибки, меняй стиль и добавляй юмор с помощью ИИ.</p>
  </section>

  <section class="panel">
    <div class="toolbar">
      <label for="mode">РЕЖИМ ОБРАБОТКИ</label>
      <select id="mode">
        <option value="fix">✦ Исправить ошибки</option>
        <option value="rewrite">Переписать лучше</option>
        <option value="short">Сократить</option>
        <option value="friendly">Дружелюбно</option>
        <option value="formal">Официально</option>
        <option value="casual">По-простому</option>
        <option value="confident">Уверенно</option>
        <option value="funny">Смешно</option>
        <option value="viking">Викинг ⚔</option>
        <option value="zombie">Зомби 🧟</option>
        <option value="troll">Тролль 😈</option>
        <option value="human">Как человек</option>
      </select>
    </div>

    <textarea id="input" maxlength="12000"
      placeholder="Вставь сюда текст…"></textarea>

    <div class="meta">
      <span id="counter">0 / 12000</span>
      <span>⌘ + Enter — обработать</span>
    </div>

    <div class="actions">
      <button class="primary" id="run">✦ Обработать текст</button>
      <button id="clear">Очистить</button>
    </div>

    <div class="resultHead">
      <strong>РЕЗУЛЬТАТ</strong>
      <button id="copy">Копировать</button>
    </div>

    <div class="result empty" id="result">
      Здесь появится обработанный текст.
    </div>

    <div id="error"></div>
  </section>

  <footer>DARK.exe · AI TEXT LAB</footer>
</main>

<script>
(() => {
  const API = "https://dark-api-eese.vercel.app";
  const $ = id => document.getElementById(id);

  const input = $("input");
  const output = $("result");
  const runButton = $("run");

  function showError(message) {
    $("error").textContent = message;
    $("error").classList.add("show");
  }

  function clearError() {
    $("error").textContent = "";
    $("error").classList.remove("show");
  }

  async function readResponse(response) {
    const raw = await response.text();

    try {
      return raw ? JSON.parse(raw) : {};
    } catch {
      throw new Error(
        `Сервер вернул не JSON. HTTP ${response.status}. ` +
        "Проверь настройки Vercel."
      );
    }
  }

  async function checkAPI() {
    try {
      const response = await fetch(`${API}/api/health`);
      const data = await readResponse(response);

      if (!response.ok || !data.ok) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }

      $("status").textContent =
        `● API подключён · ${data.model}`;
      $("status").style.color = "#86efac";
    } catch (error) {
      $("status").textContent = "● API недоступен";
      $("status").style.color = "#fb7185";
      console.error("Health check:", error);
    }
  }

  async function transform() {
    clearError();

    const text = input.value.trim();

    if (!text) {
      showError("Сначала введи текст.");
      input.focus();
      return;
    }

    runButton.disabled = true;
    runButton.textContent = "Обрабатываю…";
    output.classList.remove("empty");
    output.textContent = "DARK.exe обрабатывает текст…";

    try {
      const response = await fetch(`${API}/api/transform`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          mode: $("mode").value
        })
      });

      const data = await readResponse(response);

      if (!response.ok) {
        const details =
          data.details || data.error || `HTTP ${response.status}`;

        throw new Error(
          `${details}` +
          (data.error_type ? ` (${data.error_type})` : "")
        );
      }

      if (!data.result) {
        throw new Error("Сервер не прислал результат.");
      }

      output.textContent = data.result;

    } catch (error) {
      output.textContent = "Не удалось обработать текст.";
      output.classList.add("empty");

      showError(
        `Ошибка: ${error.message}\n\n` +
        "Открой Runtime Logs в Vercel, если ошибка повторяется."
      );

      console.error("Transform error:", error);

    } finally {
      runButton.disabled = false;
      runButton.textContent = "✦ Обработать текст";
    }
  }

  input.addEventListener("input", () => {
    $("counter").textContent =
      `${input.value.length} / 12000`;
  });

  runButton.addEventListener("click", transform);

  $("clear").addEventListener("click", () => {
    input.value = "";
    output.textContent = "Здесь появится обработанный текст.";
    output.classList.add("empty");
    $("counter").textContent = "0 / 12000";
    clearError();
    input.focus();
  });

  $("copy").addEventListener("click", async () => {
    if (output.classList.contains("empty")) {
      showError("Сначала обработай текст.");
      return;
    }

    try {
      await navigator.clipboard.writeText(output.textContent);
      $("copy").textContent = "Скопировано ✓";

      setTimeout(() => {
        $("copy").textContent = "Копировать";
      }, 1500);
    } catch {
      showError("Не удалось скопировать. Выдели результат вручную.");
    }
  });

  input.addEventListener("keydown", event => {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
      transform();
    }
  });

  checkAPI();
})();
</script>
</body>
</html>
