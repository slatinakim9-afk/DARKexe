
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080809">
<title>DARK.exe</title>
<style>
:root{--bg:#080809;--panel:#101012;--border:#292326;--red:#ff2448;--muted:#99949b;--text:#f5f3f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{width:min(100%,760px);margin:auto;padding:25px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--border)}
.logo{font-size:22px;font-weight:900;letter-spacing:2px}.logo span,h1 span{color:var(--red)}
.sub{font-size:11px;color:var(--muted);margin-top:5px}
.status{font-size:10px;color:var(--muted)}
.hero{padding:32px 0 25px}
.eyebrow{color:var(--red);font-size:10px;letter-spacing:3px;font-weight:800}
h1{font-size:clamp(36px,9vw,55px);line-height:1;letter-spacing:-2px;margin:13px 0}
.desc{font-size:13px;color:var(--muted);line-height:1.7}
.heading{margin:25px 0 12px;font-size:11px;font-weight:800;letter-spacing:1.5px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mode{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px 12px;text-align:left;color:var(--text);cursor:pointer;min-height:72px}
.mode strong{display:block;font-size:12px;margin-bottom:6px}
.mode small{color:var(--muted);font-size:11px}
.mode.active{border-color:var(--red);background:#ff244810}
.mode.active strong{color:var(--red)}
label{display:block;margin:23px 0 10px;font-size:11px;font-weight:800;letter-spacing:1.5px}
textarea{width:100%;min-height:150px;resize:vertical;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:15px;color:var(--text);outline:none;font:14px/1.7 inherit;font-family:inherit}
textarea:focus{border-color:var(--red)}
textarea::placeholder{color:#6f6971}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:10px}
.primary{margin-top:15px;width:100%;padding:16px;border:0;border-radius:8px;background:var(--red);color:white;font-size:12px;font-weight:900;letter-spacing:1px;cursor:pointer}
.primary:disabled{opacity:.6;cursor:wait}
.output{display:none;margin-top:20px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:15px}
.output-head{display:flex;align-items:center;justify-content:space-between;color:var(--red);font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:12px}
.result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.7}
.copy{padding:8px 11px;background:transparent;border:1px solid var(--border);border-radius:6px;color:white;cursor:pointer}
.notice{display:none;color:#ff9cab;font-size:12px;line-height:1.6;margin-top:12px}
footer{margin-top:35px;border-top:1px solid var(--border);padding-top:18px;color:var(--muted);font-size:10px;letter-spacing:1px}
@media(min-width:520px){.modes{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app">
<header>
  <div><div class="logo">DARK<span>.exe</span></div><div class="sub">AI TEXT ENGINE / V2.0</div></div>
  <div class="status" id="status">ПОДКЛЮЧЕНИЕ К ИИ...</div>
</header>

<section class="hero">
  <div class="eyebrow">YOUR PERSONAL TEXT ENGINE</div>
  <h1>CONTROL<br>YOUR <span>WORDS.</span></h1>
  <p class="desc">Исправляй ошибки, полностью переписывай текст и меняй его стиль с помощью ИИ.</p>
</section>

<div class="heading">01 / ВЫБЕРИ РЕЖИМ</div>
<section class="modes" id="modes">
<button class="mode active" data-mode="fix"><strong>FIX TEXT</strong><small>Исправить ошибки</small></button>
<button class="mode" data-mode="rewrite"><strong>REWRITE</strong><small>Полностью переписать</small></button>
<button class="mode" data-mode="short"><strong>SHORT</strong><small>Сделать короче</small></button>
<button class="mode" data-mode="friendly"><strong>FRIENDLY</strong><small>Дружелюбно</small></button>
<button class="mode" data-mode="formal"><strong>FORMAL</strong><small>Официально</small></button>
<button class="mode" data-mode="casual"><strong>CASUAL</strong><small>Разговорный стиль</small></button>
<button class="mode" data-mode="confident"><strong>CONFIDENT</strong><small>Уверенно и прямо</small></button>
<button class="mode" data-mode="funny"><strong>FUNNY</strong><small>Сделать смешно</small></button>
<button class="mode" data-mode="viking"><strong>VIKING</strong><small>Стиль викинга</small></button>
<button class="mode" data-mode="zombie"><strong>ZOMBIE</strong><small>Стиль зомби</small></button>
<button class="mode" data-mode="troll"><strong>TROLL</strong><small>Иронично и дерзко</small></button>
<button class="mode" data-mode="human"><strong>HUMAN</strong><small>Естественно, как человек</small></button>
</section>

<label for="inputText">02 / ТВОЙ ТЕКСТ</label>
<textarea id="inputText" maxlength="20000" placeholder="Вставь текст сюда. Можно даже с кучей ошибок..."></textarea>
<div class="meta"><span>ОБРАБОТКА ЧЕРЕЗ ИИ</span><span id="counter">0 / 20000</span></div>
<button class="primary" id="processBtn">▶ ОБРАБОТАТЬ ТЕКСТ</button>
<div class="notice" id="notice"></div>

<section class="output" id="output">
<div class="output-head"><span>03 / РЕЗУЛЬТАТ</span><button class="copy" id="copyBtn">КОПИРОВАТЬ</button></div>
<div class="result" id="result"></div>
</section>
<footer>DARK.exe <span style="color:var(--red)">●</span> TEXT TRANSFORMATION SYSTEM</footer>
</main>

<script>
/*
  ВАЖНО: здесь должен быть адрес твоего рабочего Vercel API.
  Если проект называется dark-api-eese, проверь его домен в Vercel.
*/
const API_BASE = "https://dark-api-eese.vercel.app";

let currentMode = "fix";
const input = document.getElementById("inputText");
const counter = document.getElementById("counter");
const button = document.getElementById("processBtn");
const notice = document.getElementById("notice");
const output = document.getElementById("output");
const result = document.getElementById("result");

document.querySelectorAll(".mode").forEach(modeButton => {
  modeButton.addEventListener("click", () => {
    document.querySelectorAll(".mode").forEach(b => b.classList.remove("active"));
    modeButton.classList.add("active");
    currentMode = modeButton.dataset.mode;
    notice.style.display = "none";
  });
});

input.addEventListener("input", () => {
  counter.textContent = input.value.length + " / 20000";
});

function showError(message) {
  notice.textContent = message;
  notice.style.display = "block";
}

async function checkApi() {
  try {
    const r = await fetch(API_BASE + "/api/health");
    const data = await r.json();
    document.getElementById("status").textContent =
      data.ai_configured ? "● ИИ ПОДКЛЮЧЁН" : "● НЕТ API-КЛЮЧА";
  } catch (e) {
    document.getElementById("status").textContent = "● ПРОВЕРЬ АДРЕС API";
  }
}
checkApi();

button.addEventListener("click", async () => {
  const text = input.value.trim();

  if (!text) {
    showError("Сначала вставь текст.");
    input.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ ИИ ОБРАБАТЫВАЕТ ТЕКСТ...";
  notice.style.display = "none";
  output.style.display = "none";

  try {
    const response = await fetch(API_BASE + "/api/transform", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: text, mode: currentMode})
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка API: " + response.status);
    }

    if (!data.result || !data.result.trim()) {
      throw new Error("ИИ вернул пустой ответ. Попробуй ещё раз.");
    }

    result.textContent = data.result.trim();
    output.style.display = "block";
    output.scrollIntoView({behavior:"smooth", block:"nearest"});
  } catch (error) {
    showError("Не удалось обработать текст: " + error.message +
      ". Проверь адрес API и деплой Vercel.");
  } finally {
    button.disabled = false;
    button.textContent = "▶ ОБРАБОТАТЬ ТЕКСТ";
  }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(result.textContent);
    document.getElementById("copyBtn").textContent = "СКОПИРОВАНО ✓";
  } catch (e) {
    showError("Не удалось скопировать автоматически. Выдели результат и скопируй вручную.");
  }
  setTimeout(() => {
    document.getElementById("copyBtn").textContent = "КОПИРОВАТЬ";
  }, 1500);
});
</script>
</body>
</html>
